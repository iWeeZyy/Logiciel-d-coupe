name: Build Windows GUI (.exe + installateur)

# DECLENCHEMENT MANUEL UNIQUEMENT, ET C'EST DELIBERE.
#
# Ce depot ETAIT prive : les minutes d'execution etaient comptees, et un runner
# Windows est facture DEUX FOIS le temps reel. Un build de cette application
# prend environ 22 minutes, soit 44 minutes facturees. Avec un declenchement
# a chaque poussee sur main, et DEUX workflows qui se declenchaient ensemble,
# trois jours de travail ont consomme une centaine de builds et epuise le
# quota mensuel.
#
# Un installateur ne sert que quand quelqu'un veut l'installer : il se demande
# donc, depuis l'onglet Actions ("Run workflow") ou par l'API. Pour revenir au
# declenchement automatique, remettre le bloc `push:` retire ici.
#
# DEPUIS, LE DEPOT EST PUBLIC : les minutes redeviennent gratuites sur les
# runners standards, et remettre `push:` ne couterait plus rien. Le
# declenchement reste manuel parce qu'un installateur ne sert que quand on
# veut l'installer, pas a chaque poussee.
on:
  workflow_dispatch: {}

# Une seule execution a la fois par workflow : deux builds du meme commit
# ont ete observes, et le second ne servait a rien.
concurrency:
  group: build-windows-gui.yml
  cancel-in-progress: true

# LE JETON DOIT POUVOIR ECRIRE, ET IL FAUT LE DIRE ICI.
#
# La derniere etape publie l'installateur en Release, ce qui ecrit dans le
# depot. Sans ce bloc, le jeton prend les droits par defaut du depot -- et
# ceux-ci ne sont pas une constante : le passage de prive a public a suffi a
# les ramener en lecture seule, et le build a echoue sur
# « HTTP 403: Resource not accessible by integration » APRES avoir tout
# compile. Declarer le droit dans le workflow le rend independant d'un
# reglage d'interface que personne ne pense a verifier.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download static ffmpeg (Windows, includes libass/libx264)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Voir build-windows-exe.yml pour le contexte : gyan.dev est une URL
          # stable, BtbN un repli si jamais gyan.dev est injoignable.
          $urls = @(
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip",
            "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip"
          )
          $downloaded = $false
          foreach ($url in $urls) {
            try {
              Write-Host "Telechargement de $url..."
              Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip -TimeoutSec 90
              $downloaded = $true
              break
            } catch {
              Write-Warning "Echec depuis $url : $_"
            }
          }
          if (-not $downloaded) {
            throw "Impossible de telecharger ffmpeg depuis toutes les sources connues."
          }
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extracted
          $binDir = Get-ChildItem -Path ffmpeg_extracted -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1 -ExpandProperty DirectoryName
          echo "FFMPEG_BIN_DIR=$binDir" >> $env:GITHUB_ENV

      - name: Build with PyInstaller (--onedir, see build/clip_farming_gui.spec)
        run: pyinstaller build/clip_farming_gui.spec --noconfirm --clean --distpath dist

      - name: Bundle ffmpeg.exe / ffprobe.exe next to ClipFarming.exe
        shell: pwsh
        run: |
          Copy-Item "$env:FFMPEG_BIN_DIR\ffmpeg.exe" "dist\ClipFarming\ffmpeg.exe"
          Copy-Item "$env:FFMPEG_BIN_DIR\ffprobe.exe" "dist\ClipFarming\ffprobe.exe"

      - name: Zip the distributable (version portable, jointe a la Release)
        shell: pwsh
        run: Compress-Archive -Path "dist\ClipFarming\*" -DestinationPath "ClipFarming-windows.zip"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build the installer (ClipFarming-Setup.exe)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "build\installer.iss"

      # AUCUN upload-artifact ici, volontairement. Les deux fichiers produits
      # (l'installateur et le zip portable) sont attaches a la Release juste
      # apres, qui donne en plus une adresse qui ne bouge jamais :
      #   https://github.com/<owner>/<repo>/releases/latest
      # Les uploader AUSSI en artifacts stockait environ 650 Mo par commit
      # pendant 30 jours pour des fichiers deja publies ailleurs. Le quota de
      # stockage Actions a fini par etre atteint, et comme l'upload se faisait
      # AVANT la publication, un quota plein empechait la Release de sortir --
      # un build parfaitement reussi ne produisait plus aucun telechargement.
      # Si un artifact redevient necessaire un jour, le remettre APRES l'etape
      # de publication, jamais avant.
      - name: Publish the installer as a Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v1.0.0-build.${{ github.run_number }}"
          $sha = "${{ github.sha }}".Substring(0, 7)
          $date = Get-Date -Format "dd/MM/yyyy HH:mm"

          # Le sujet du commit (premiere ligne seulement) sert de description :
          # le corps complet des messages de ce depot fait plusieurs paragraphes.
          # Notes ecrites dans un fichier plutot qu'en here-string PowerShell :
          # un here-string doit se fermer en colonne 0, ce qui terminerait le
          # bloc YAML de ce `run`.
          $lines = @(
            "Installateur Windows de ClipFarming, compile le $date (commit $sha).",
            "",
            (git log -1 --pretty=%s),
            "",
            "**ClipFarming-Setup.exe** : l'installateur. Desinstalle la version",
            "precedente, puis lance-le.",
            "",
            "**ClipFarming-windows.zip** : version portable, sans installation."
          )
          Set-Content -Path release_notes.md -Value $lines -Encoding utf8

          gh release create $tag `
            "build/installer_output/ClipFarming-Setup.exe" `
            "ClipFarming-windows.zip" `
            --title "ClipFarming $tag" `
            --notes-file release_notes.md `
            --latest
