name: Build Windows .exe

# DECLENCHEMENT MANUEL UNIQUEMENT, ET C'EST DELIBERE.
#
# Ce depot ETAIT prive : les minutes d'execution etaient comptees, et un runner
# Windows est facture DEUX FOIS le temps reel. Un build de cette application
# prend environ 22 minutes, soit 44 minutes facturees. Avec un declenchement
# a chaque poussee sur main, et DEUX workflows qui se declenchaient ensemble,
# trois jours de travail ont consomme une centaine de builds et epuise le
# quota mensuel.
#
# Un installateur ne sert que quand quelqu'un veut l'installer : il se demande
# donc, depuis l'onglet Actions ("Run workflow") ou par l'API. Pour revenir au
# declenchement automatique, remettre le bloc `push:` retire ici.
#
# DEPUIS, LE DEPOT EST PUBLIC : les minutes redeviennent gratuites sur les
# runners standards, et remettre `push:` ne couterait plus rien. Le
# declenchement reste manuel parce qu'un installateur ne sert que quand on
# veut l'installer, pas a chaque poussee.
# Ce workflow construit la version EN LIGNE DE COMMANDE, dont personne ne
# se sert aujourd'hui : l'application utilisee est la version graphique.
# Il doublait la facture a chaque poussee.
on:
  workflow_dispatch: {}

# Une seule execution a la fois par workflow : deux builds du meme commit
# ont ete observes, et le second ne servait a rien.
concurrency:
  group: build-windows-exe.yml
  cancel-in-progress: true

# LE JETON DOIT POUVOIR ECRIRE, ET IL FAUT LE DIRE ICI.
#
# La derniere etape publie l'installateur en Release, ce qui ecrit dans le
# depot. Sans ce bloc, le jeton prend les droits par defaut du depot -- et
# ceux-ci ne sont pas une constante : le passage de prive a public a suffi a
# les ramener en lecture seule, et le build a echoue sur
# « HTTP 403: Resource not accessible by integration » APRES avoir tout
# compile. Declarer le droit dans le workflow le rend independant d'un
# reglage d'interface que personne ne pense a verifier.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download static ffmpeg (Windows, includes libass/libx264)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # gyan.dev's "release-essentials" URL is a stable, permanent pointer
          # (not a rotating "latest release asset" like BtbN's, which 404'd once
          # here mid-republish on their end) -- tried first. BtbN kept as fallback
          # in case gyan.dev is ever unreachable.
          $urls = @(
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip",
            "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip"
          )
          $downloaded = $false
          foreach ($url in $urls) {
            try {
              Write-Host "Telechargement de $url..."
              Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip -TimeoutSec 90
              $downloaded = $true
              break
            } catch {
              Write-Warning "Echec depuis $url : $_"
            }
          }
          if (-not $downloaded) {
            throw "Impossible de telecharger ffmpeg depuis toutes les sources connues."
          }
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extracted
          $binDir = Get-ChildItem -Path ffmpeg_extracted -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1 -ExpandProperty DirectoryName
          echo "FFMPEG_BIN_DIR=$binDir" >> $env:GITHUB_ENV

      - name: Build with PyInstaller (--onedir, see build/clip_farming.spec)
        run: pyinstaller build/clip_farming.spec --noconfirm --clean --distpath dist

      - name: Bundle ffmpeg.exe / ffprobe.exe next to clip_farming.exe
        shell: pwsh
        run: |
          Copy-Item "$env:FFMPEG_BIN_DIR\ffmpeg.exe" "dist\clip_farming\ffmpeg.exe"
          Copy-Item "$env:FFMPEG_BIN_DIR\ffprobe.exe" "dist\clip_farming\ffprobe.exe"

      # Ce workflow verifie que la version ligne de commande compile toujours ;
      # il ne publie rien. Le zip produit ici n'etait telecharge par personne --
      # l'application distribuee est la version graphique, publiee en Release par
      # build-windows-gui.yml -- mais il occupait 390 Mo de stockage Actions par
      # commit, ce qui a fini par saturer le quota et faire echouer le workflow
      # qui, lui, publie vraiment. Pour recuperer ponctuellement l'executable en
      # ligne de commande, relancer ce workflow avec une etape upload-artifact
      # temporaire.
