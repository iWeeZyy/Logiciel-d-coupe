# Bande-annonce ActuaFilms automatique (news_story/auto_trailer.py).
#
# Workflow REUTILISABLE : il ne se declenche jamais seul dans ce depot
# public. Il est appele par le depot PRIVE (docs/auto-trailer-caller.yml) :
# artefact, journaux et cle Claude restent prives. La memoire des
# bandes-annonces deja publiees (news_publiees.json, le meme fichier que sur
# le PC) vit dans le depot prive et y est remise a jour apres chaque video.
# Aucune publication sur un reseau social.
name: Bande-annonce ActuaFilms (réutilisable)

on:
  workflow_call:
    inputs:
      force:
        description: "Ignorer le rythme (essai) ; jamais une bande-annonce deja publiee"
        type: boolean
        default: false
      film:
        description: "Ce film-la seulement (titre), au lieu du choix automatique"
        type: string
        default: ""
      video-page:
        description: "Page video AlloCine donnee a la main (hors du fil), avec video-title"
        type: string
        default: ""
      video-title:
        type: string
        default: ""
      retention-days:
        type: number
        default: 3
      app-ref:
        type: string
        default: main
    secrets:
      ANTHROPIC_API_KEY:
        required: false
    outputs:
      produit:
        description: "true si une bande-annonce a ete faite"
        value: ${{ jobs.bande-annonce.outputs.produit }}

jobs:
  bande-annonce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write                 # memoire des publications, depot appelant
    outputs:
      produit: ${{ steps.run.outputs.produit }}
    env:
      PYTHONUNBUFFERED: "1"
      QT_QPA_PLATFORM: offscreen      # la fenetre « Créer un visuel », sans ecran
    steps:
      - name: Depot appelant (memoire des publications)
        uses: actions/checkout@v4
        with:
          path: appelant

      - name: Code du logiciel
        uses: actions/checkout@v4
        with:
          repository: iWeeZyy/Logiciel-d-coupe
          ref: ${{ inputs.app-ref }}
          path: app

      - name: Polices des sous-titres (cache)
        uses: actions/cache@v4
        with:
          path: ~/.fonts/msttcorefonts
          key: msttcorefonts-arial-v1

      - name: ffmpeg (libass), polices, bibliotheques Qt
        timeout-minutes: 10
        run: bash app/.github/scripts/install_media.sh libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Dependances Python
        working-directory: app
        run: |
          # requirements.txt reste la seule liste. Qt est GARDE ici : la
          # fenetre est ouverte sans ecran pour en lire les reglages.
          grep -v -i -E "^(llama-cpp-python|pyttsx3|keyring|gradio_client|pytest)" \
            requirements.txt > "$RUNNER_TEMP/requirements-bande-annonce.txt"
          python -m pip install -q -r "$RUNNER_TEMP/requirements-bande-annonce.txt"

      - name: Modeles Whisper (cache)
        uses: actions/cache@v4
        with:
          path: |
            app/whisper-models
            ~/.cache/huggingface
          key: whisper-${{ runner.os }}-v1

      - name: Bande-annonce
        id: run
        working-directory: app
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          FILM: ${{ inputs.film }}
          VIDEO_PAGE: ${{ inputs.video-page }}
          VIDEO_TITLE: ${{ inputs.video-title }}
        run: |
          cp "$GITHUB_WORKSPACE/appelant/news_publiees.json" news_publiees.json 2>/dev/null || true
          # --sans-youtube : YouTube refuse les serveurs GitHub (« Sign in to
          # confirm you're not a bot », essai du 2026-10-31) ; les videos
          # AlloCine (Dailymotion) y sont servies en 1080p.
          python gui_main.py --auto-trailer --sans-youtube --out "$RUNNER_TEMP/bande-annonce" $FORCE \
            ${FILM:+--film "$FILM"} ${VIDEO_PAGE:+--page-video "$VIDEO_PAGE" --titre "$VIDEO_TITLE"}

      - name: Memoire des publications
        if: steps.run.outputs.produit == 'true'
        working-directory: appelant
        run: |
          cp "$GITHUB_WORKSPACE/app/news_publiees.json" news_publiees.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news_publiees.json
          git commit -m "Bande-annonce publiee : memoire mise a jour" || exit 0
          git push

      - name: Bande-annonce en artefact
        if: steps.run.outputs.produit == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bande-annonce-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/bande-annonce/*.mp4
            ${{ runner.temp }}/bande-annonce/*.txt
          retention-days: ${{ inputs.retention-days }}
