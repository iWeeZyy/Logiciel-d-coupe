# Compilation des clips Twitch les plus vus de la semaine (radar/weekly_top.py).
#
# Workflow REUTILISABLE : il ne se declenche jamais seul dans ce depot (public).
# Il est appele chaque semaine par un depot PRIVE (voir
# docs/weekly-top-caller.yml) : le travail tourne alors dans le contexte du
# depot prive -- artefacts et journaux prives, minutes decomptees la-bas,
# secrets Twitch ranges la-bas. Ce depot n'heberge que le code.
# Aucune publication sur un reseau social : la compilation est deposee en
# artefact, a telecharger et publier a la main.
name: Compilation des plus vus (réutilisable)

on:
  workflow_call:
    inputs:
      config-path:
        description: "Configuration dans le depot appelant (streamers, autorisations)"
        type: string
        default: weekly_compilation.json
      retention-days:
        description: "Duree de conservation de l'artefact (jours)"
        type: number
        default: 3
      only:
        description: "Un seul streamer (essai a la main) ; vide = toute la liste"
        type: string
        default: ""
      accept-long:
        description: "Produire meme si la compilation depasse 2 min 45 (confirme par l'utilisateur)"
        type: boolean
        default: false
      memory-path:
        description: "Memoire des clips publies dans le depot appelant (partagee avec le clip du jour) ; vide = aucune"
        type: string
        default: ""
      app-ref:
        description: "Version du logiciel (branche ou tag de Logiciel-d-coupe)"
        type: string
        default: main
    secrets:
      TWITCH_CLIENT_ID:
        required: true
      TWITCH_CLIENT_SECRET:
        required: true

jobs:
  compilation:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write                 # memoire des clips publies, depot appelant
    env:
      PYTHONUNBUFFERED: "1"
      QT_QPA_PLATFORM: offscreen      # filet : la commande n'importe pas Qt
    steps:
      - name: Configuration du depot appelant
        uses: actions/checkout@v4
        with:
          path: appelant

      - name: Code du logiciel
        uses: actions/checkout@v4
        with:
          repository: iWeeZyy/Logiciel-d-coupe
          ref: ${{ inputs.app-ref }}
          path: app

      - name: ffmpeg (libass) et polices des sous-titres
        # Les polices Microsoft viennent de SourceForge, qui pend parfois :
        # sans limite, un run est reste bloque 40 min (2026-11-06).
        timeout-minutes: 15
        run: |
          # Les styles de sous-titres utilisent Arial / Arial Black : sans elles,
          # libass prendrait une police de repli et le rendu changerait.
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" \
            | sudo debconf-set-selections
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fontconfig ttf-mscorefonts-installer > /dev/null
          sudo fc-cache -f > /dev/null
          ffmpeg -hide_banner -filters | grep -E " (subtitles|ass) " \
            || { echo "::error::ffmpeg sans libass"; exit 1; }
          fc-list | grep -qi "Arial Black" \
            || echo "::warning::Police Arial Black absente : sous-titres en police de repli"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Dependances Python
        working-directory: app
        run: |
          # requirements.txt reste la seule liste ; on n'en retire que ce que
          # la commande sans fenetre n'utilise pas (interface Qt, IA locale
          # llama -- longue a compiler --, voix Windows, coffre de mots de
          # passe, tests). test_weekly_top.py verifie que Qt n'est jamais
          # importe sur ce chemin.
          grep -v -i -E "^(PySide6|llama-cpp-python|pyttsx3|keyring|gradio_client|pytest)" \
            requirements.txt > "$RUNNER_TEMP/requirements-sans-fenetre.txt"
          python -m pip install -q -r "$RUNNER_TEMP/requirements-sans-fenetre.txt"

      - name: Modeles Whisper et reconnaissance des visages (cache)
        uses: actions/cache@v4
        with:
          path: |
            app/whisper-models
            app/.cache/models
            ~/.cache/huggingface
          key: modeles-${{ runner.os }}-v2

      - name: Compilation
        working-directory: app
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          CONFIG_PATH: ${{ inputs.config-path }}
          ONLY: ${{ inputs.only }}
          ACCEPT_LONG: ${{ inputs.accept-long }}
          MEMORY_PATH: ${{ inputs.memory-path }}
        run: |
          extra=()
          [ "$ACCEPT_LONG" = "true" ] && extra+=(--accepter-duree)
          [ -n "$MEMORY_PATH" ] && extra+=(--memory "$GITHUB_WORKSPACE/appelant/$MEMORY_PATH")
          python gui_main.py --weekly-top \
            --config "$GITHUB_WORKSPACE/appelant/$CONFIG_PATH" --only "$ONLY" \
            --out "$RUNNER_TEMP/compilation" --work-dir "$RUNNER_TEMP/travail" "${extra[@]}"

      - name: Memoire des clips publies
        if: inputs.memory-path != ''
        working-directory: appelant
        env:
          MEMORY_PATH: ${{ inputs.memory-path }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Fusion, pas rebase : le top et le clip du jour peuvent ecrire la
          # memoire en meme temps (conflit du 2026-11-11, memoire perdue).
          cp "$MEMORY_PATH" "$RUNNER_TEMP/memoire_locale.json"
          branch=$(git rev-parse --abbrev-ref HEAD)
          for attempt in 1 2 3 4; do
            git fetch -q origin "$branch"
            git reset -q --hard "origin/$branch"
            git show "origin/$branch:$MEMORY_PATH" > "$RUNNER_TEMP/memoire_distante.json" \
              2>/dev/null || echo '{}' > "$RUNNER_TEMP/memoire_distante.json"
            python "$GITHUB_WORKSPACE/app/radar/memory_merge.py" \
              "$RUNNER_TEMP/memoire_distante.json" "$RUNNER_TEMP/memoire_locale.json" "$MEMORY_PATH"
            git add "$MEMORY_PATH"
            git diff --cached --quiet && exit 0
            git commit -q -m "Top de la semaine : memoire mise a jour"
            git push -q origin "HEAD:$branch" && exit 0
            sleep $((attempt * 5))
          done
          exit 1

      - name: Quelques images de controle
        if: always()
        run: |
          # Une image a 10 %, 50 % et 90 % de chaque video : verifier le rendu
          # sans telecharger la video entiere.
          shopt -s nullglob
          for video in "$RUNNER_TEMP"/compilation/*.mp4; do
            duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$video")
            for pct in 10 50 90; do
              at=$(python -c "print(round($duration * $pct / 100, 2))")
              ffmpeg -v error -y -ss "$at" -i "$video" -frames:v 1 -vf scale=360:-2 \
                "$RUNNER_TEMP/compilation/apercu_$(basename "$video" .mp4)_${pct}.jpg"
            done
          done

      - name: Compilation en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compilation-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/compilation/*.mp4
            ${{ runner.temp }}/compilation/*.txt
            ${{ runner.temp }}/compilation/*.jpg
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: warn
