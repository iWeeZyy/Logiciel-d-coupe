# A copier dans le depot PRIVE, sous .github/workflows/weekly-top.yml
# (avec weekly_compilation.json a la racine du depot prive).
#
# Compilation des clips Twitch les plus vus de la semaine, pour UN streamer
# choisi a chaque fois (demande de Lucas : pas de compilation automatique de
# toute la liste). Lancee a la main : bouton « Run workflow » (champ
# « streamer »), ou par Claude apres lui avoir demande lequel.
#
# Appelle le workflow defini dans Logiciel-d-coupe
# (.github/workflows/weekly-top.yml). Le travail tourne dans CE depot :
# artefact et journaux prives. Le streamer doit figurer dans « authorized »
# de weekly_compilation.json, sinon il est refuse.
#
# Secrets : TWITCH_CLIENT_ID et TWITCH_CLIENT_SECRET.
name: Compilation des plus vus de la semaine

on:
  workflow_dispatch:
    inputs:
      streamer:
        description: "Le streamer à compiler (login Twitch, ex. anyme023)"
        type: string
        required: true

concurrency:
  group: weekly-top
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  compilation:
    if: inputs.streamer != ''
    uses: iWeeZyy/Logiciel-d-coupe/.github/workflows/weekly-top.yml@main
    with:
      config-path: weekly_compilation.json
      retention-days: 3
      only: ${{ inputs.streamer }}
    secrets:
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
