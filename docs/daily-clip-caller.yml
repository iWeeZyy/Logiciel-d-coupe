# A copier dans le depot PRIVE, sous .github/workflows/clip-du-jour.yml.
#
# Clip du jour : le clip Twitch le plus vu des dernieres 24 h parmi les
# streamers autorises de weekly_compilation.json. Lance par Claude chaque jour
# (tache programmee), ou a la main (« Run workflow »). La memoire
# clips_publies.json est mise a jour dans ce depot apres chaque clip.
#
# Secrets : TWITCH_CLIENT_ID et TWITCH_CLIENT_SECRET.
name: Clip du jour

on:
  workflow_dispatch:

concurrency:
  group: clip-du-jour
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  clip:
    uses: iWeeZyy/Logiciel-d-coupe/.github/workflows/daily-clip.yml@main
    with:
      config-path: weekly_compilation.json
      memory-path: clips_publies.json
      retention-days: 1
    secrets:
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
